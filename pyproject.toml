[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "load_arena"
version = "0.2.0"
description = "Load Arena is a Python toolkit for post-processing and comparing wind turbine aeroelastic simulation results."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "plotly",
    "seaborn",
    "pandas",
    "matplotlib",
    "rich",
    "scipy",
    "xarray",
    "openpyxl",
    "numba",
    "scipp",
    "pydantic>=2.13.5",
    "PyYAML>=6.0",
    "google-genai>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
