
name: Test and Deploy Pipeline CI/CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/CI-pipeline.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/CI-pipeline.yml"

# ==================================================
# SECTION 2: BUILD AND TEST JOB
# ==================================================

jobs:
  
  build-and-test:
    runs-on: ${{ matrix.os }}
    
    strategy: 
      matrix: 
        os: [windows-latest]
        python-version: ["3.10"]
    
    steps:
    # Add steps for:
    # 1. Checkout code
    # 2. Set up Python 3.10 or higher with pip caching
    # 3. Install dependencies from pyproject.toml
    # 4. Run pytest with coverage reporting
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
#          pip install pytest pytest-cov

      - name: Run tests
        run: pytest  

