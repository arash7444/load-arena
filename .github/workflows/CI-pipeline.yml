name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "tests/**"
      - "demo/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/CI-pipeline.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "tests/**"
      - "demo/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/CI-pipeline.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
